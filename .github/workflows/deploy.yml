name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Lightsail
        uses: appleboy/ssh-action@v1.0.3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          envs: GH_TOKEN
          # Do NOT use script_stop — it breaks if/else (false tests become exit 1)
          command_timeout: 30m
          script: |
            set -e
            APP_DIR=/var/www/sparkdraw-frontend
            REPO_SLUG=kaveeshawi/sparkdraw-frontend-20305805.git
            AUTH_REPO="https://x-access-token:${GH_TOKEN}@github.com/${REPO_SLUG}"

            if [ -z "$GH_TOKEN" ]; then
              echo "GH_TOKEN is empty — cannot clone private repo"
              exit 1
            fi

            sudo mkdir -p /var/www
            if [ ! -d "$APP_DIR/.git" ]; then
              sudo rm -rf "$APP_DIR"
              sudo git clone "$AUTH_REPO" "$APP_DIR"
            fi

            # Repo was often cloned as root — fix ownership before npm
            sudo git config --system --add safe.directory "$APP_DIR" || true
            git config --global --add safe.directory "$APP_DIR" || true
            sudo chown -R "$USER:$USER" "$APP_DIR"

            cd "$APP_DIR"
            git remote set-url origin "$AUTH_REPO"
            git fetch origin main
            git reset --hard origin/main
            git remote set-url origin "https://github.com/${REPO_SLUG}"

            npm ci || npm install
            npm run build

            # Nginx typically serves dist/ as www-data
            if [ -d dist ]; then
              sudo chown -R www-data:www-data dist
            fi
